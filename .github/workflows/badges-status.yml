# Mirror the Open Badges revocation list to https://institute.wirewalk.com/badges/status/1.json,
# the permanent statusListCredential URL signed into every badge (wirewalk-institute-worker
# ai/plans/open-badges-3.md section 14). The learning Worker signs the list
# ({api_base}/api/ob3/status/1, api_base from _config.yml); this job fetches it on a 10-minute
# schedule, validates it (.github/scripts/badges-status.mjs) and commits it only when the
# revocation bits or the signing key changed. The schedule is not a bound: GitHub delays and drops
# scheduled runs under load (after go-live it ran none for about five hours, WIA-019). Public
# wording: usually within 30 minutes. The Worker's ob3.status-freshness task checks the published
# copy every 15 minutes and emails ADMIN_NOTIFY_EMAILS when it is behind; the response is
# "Run workflow" on this workflow (Actions tab), which needs no input.
# Minutes 4,14,...,54: off the top of the hour, GitHub's busiest (most delayed) time. GitHub
# ignores intervals under 5 minutes, so shortening it would not help.
#
# Uses only the default GITHUB_TOKEN (contents: write); no other secrets. Scheduled runs happen on
# the default branch only, and GitHub disables a schedule after 60 days without repository activity.
name: Badges status list

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges-status
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch and validate the signed status list
        id: mirror
        run: node .github/scripts/badges-status.mjs

      - name: Commit and push when it changed
        if: steps.mirror.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add badges/status/1.json
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Badges: update the revocation status list"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rejected (attempt ${attempt}); rebasing on the latest ${GITHUB_REF_NAME}."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push the status list after 3 attempts." >&2
          exit 1
