title: Wirewalk Institute of AI
description: >-
  Professional AI training with automated exams and certificates: AI models and
  vendors, building AI applications, model development, training at scale, AI
  infrastructure and hardware, AI security, governance and executive programs.
author: Wirewalk Institute of AI
email: sales@wirewalk.com

# Served at the ROOT of institute.wirewalk.com (see the CNAME file).
# baseurl MUST stay empty: a non-empty baseurl makes every Liquid-generated
# link render as /institute-wirewalk/... and 404 on the live custom domain.
# See wirewalk-web-ops DECISIONS.md D-001.
url: https://institute.wirewalk.com
baseurl: ""

# The learning Worker. Public pages read live prices from {api_base}/api/catalog
# (PLATFORM-SPEC.md §6); prices are never baked into the HTML (estate D-003).
api_base: https://wirewalk-institute.wirewalk-upload.workers.dev

# Cloudflare Turnstile SITE key (public by design) for /learn/ sign-up and password reset.
# MUST be set before launch, paired with TURNSTILE_SECRET on the learning Worker: with it
# empty the widget never renders and the Worker rejects every sign-up/reset in production.
# Creating the widget (hostname institute.wirewalk.com) is a coordinator/Cloudflare step.
turnstile_sitekey: "0x4AAAAAAFZaAmywY6WsOToE"   # widget "Wirewalk Institute" (institute.wirewalk.com, localhost)

# Portal endpoint shared by every Wirewalk site's enquiry form.
enquiry_endpoint: https://wirewalk-portal.wirewalk-upload.workers.dev/api/enquiry

timezone: America/New_York
markdown: kramdown
kramdown:
  input: GFM

# Generated by wirewalk-institute-worker `node tools/build.mjs --site <this repo>`.
# Never hand-edit _courses/, _tracks/, _programs/ or _data/catalog.json.
collections:
  courses:
    output: true
    permalink: /courses/:name/
  tracks:
    output: true
    permalink: /tracks/:name/
  programs:
    output: true
    permalink: /programs/:name/

# Never use `layout: null` anywhere (wirewalk-web-ops GOTCHAS G-01): the page is
# silently not generated. Pages without a layout key get `default` from here.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - audits
  - AI.MD
  - AI.md
  - AGENTS.md
  - CLAUDE.md
  - node_modules
